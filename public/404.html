<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA 404 Redirect to index.html
      const pathSegments = window.location.pathname.split('/');
      window.location.replace(window.location.origin + '/' + pathSegments[1] + '/index.html');
    </script>
  </head>
  <body>
    <p>Redirecting to WrestleFest Vocabulary Championship...</p>
  </body>
</html>
